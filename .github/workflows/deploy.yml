name: Deploy Web (stockealo.online) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # stockealo.online/      → página principal (por ahora lleva a /app)
      # stockealo.online/app    → app web de los negocios
      # stockealo.online/admin  → panel de administrador (app aparte: lib/main_admin.dart)
      - name: Build Web (app)
        run: |
          flutter build web --base-href "/app/" --release
          mkdir -p build/site
          mv build/web build/site/app

      - name: Build Web (admin)
        run: |
          flutter build web -t lib/main_admin.dart --base-href "/admin/" --release
          mv build/web build/site/admin

      - name: Assemble site
        run: |
          cp web_site/index.html web_site/404.html web_site/CNAME build/site/
          touch build/site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          cname: stockealo.online
