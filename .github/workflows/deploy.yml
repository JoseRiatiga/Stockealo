name: Deploy Web (stockealo.online) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # stockealo.online/      → página principal (web_site/index.html)
      # stockealo.online/app    → app web de los negocios
      # stockealo.online/admin  → panel de administrador (app aparte: lib/main_admin.dart)
      # stockealo.online/tienda/<nombre> → tienda en línea de un negocio (lib/main_store.dart)
      - name: Build Web (app)
        run: |
          flutter build web --base-href "/app/" --release --source-maps
          mkdir -p build/site
          mv build/web build/site/app

      - name: Build Web (admin)
        run: |
          flutter build web -t lib/main_admin.dart --base-href "/admin/" --release --pwa-strategy=none --source-maps
          mv build/web build/site/admin

      - name: Build Web (tienda)
        run: |
          flutter build web -t lib/main_store.dart --base-href "/tienda/" --release --pwa-strategy=none --source-maps
          mv build/web build/site/tienda

      # Página principal, páginas de regreso de Wompi y Términos/Privacidad (generados
      # desde los textos de la app, así la web y la app dicen lo mismo)
      - name: Assemble site
        run: |
          python3 tool/build_legal_pages.py web_site
          cp -r web_site/. build/site/
          touch build/site/.nojekyll

      # 0.18.8: mapas del código de cada versión, para traducir un error del panel
      # (main.dart.js:67719) a la línea de Dart. No van a la página pública: quedan
      # como archivo de esta ejecución en GitHub Actions (90 días). main.dart.js no se
      # toca (el modo sin conexión lo guarda por su huella); su referencia al mapa solo
      # da un 404 si alguien abre las herramientas del navegador.
      - name: Keep source maps out of the site
        run: |
          for app in app admin tienda; do
            mkdir -p "build/maps/$app"
            find "build/site/$app" -name '*.map' -exec mv {} "build/maps/$app/" \;
          done

      - name: Upload source maps
        uses: actions/upload-artifact@v4
        with:
          name: web-source-maps-${{ github.sha }}
          path: build/maps
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          cname: stockealo.online
