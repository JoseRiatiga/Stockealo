name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Reportes en Excel
            - Nueva pantalla de Reportes: elige qué descargar (inventario con tallas y colores, ventas, clientes y fiados, movimientos y ganancias).
            - Escoge el periodo: hoy, esta semana, este mes, unas fechas o todo.
            - Descárgalo en un solo Excel o en un archivo por cada parte.

            ### Tallas y colores en el detalle del producto
            - Al ver un producto ahora aparecen sus tallas y colores con la cantidad de cada uno.
            - Ajustar el stock de un producto con variantes se hace talla por talla y color por color; el total se calcula solo.
            - El detalle del producto tiene el diseño nuevo.

            ### Correcciones
            - La pantalla de mantenimiento ya no se queda en gris.
          draft: false
          prerelease: false
