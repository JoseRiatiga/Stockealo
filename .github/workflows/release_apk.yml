name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Promociones (para todos)
            - Crea promociones con el nombre que quieras: % de descuento o lleva X, paga Y (2×1, 3×2), con fechas.
            - Para todo, una categoría o los productos que marques. Vender las aplica solas y se apagan solas al terminar.
            - El tiquete dice qué promoción se usó y Reportes muestra cuánto vendió y descontó cada una.
            - Con Pro, la tienda en línea y los catálogos las muestran con su cinta.

            ### Pedidos de la tienda
            - Cada pedido llega con su código (T-0001) a Ventas › Cotizaciones, y el código va en el WhatsApp.
            - Al cobrar un pedido eliges cómo se entrega: ya se lo llevó, lo recoge después o envío.
            - «Por entregar» en Ventas y en Inicio, hasta marcarlo entregado. Los pedidos sin confirmar vencen a los 7 días.

            ### Sin conexión
            - Si se va el internet, la venta se guarda y se sube sola al volver. Verás «Pendiente de subir» en Ventas.
            - Nada se pierde: si algo no sube, queda para reintentar en Ajustes.

            ### Más
            - Nuevo diseño en Clientes y proveedores, Productos, Stock, Reportes y Servicios.
            - Tienda: tallas y colores más claros, fotos de portada opcionales, carrito con el tema de la tienda.
            - El lector de códigos ya no se queda leyendo en bucle y descarta lecturas malas.
            - Al borrar un producto, una foto o tu cuenta, ya no quedan archivos guardados.
          draft: false
          prerelease: false
