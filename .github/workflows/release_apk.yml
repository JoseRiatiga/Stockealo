name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Arreglos de cuentas y planes (0.18.2)
            - «Sincronizar ahora» ya no falla cuando tienes un negocio con servicios y otro sin ellos.
            - Si tienes Pro y Pro Servicios, ves la fecha de cada uno y el aviso llega a tiempo.
            - Cada venta dice de qué día es, no solo la hora.
            - Con sedes cerradas puedes ver su historial en «Todas las sedes».
            - Antes de mandar un negocio con Pro a la papelera, te avisamos lo que pierdes.

            ### Sedes más claras (0.18.1)
            - El recibo y el cierre de caja dicen en qué sede se hicieron.
            - En Stock ves cuánto hay de cada producto en tus otras sedes.
            - Abrir una sede es más fácil, con su dirección y su teléfono.
            - El valor del inventario se calcula a precio de costo.

            ### Sedes: varios locales en un negocio (0.18.0)
            - Abre sedes en Módulos: cada una con su stock, sus ventas y su caja.
            - Cambia de sede desde el botón de tu negocio en el menú.
            - Mira los reportes de una sede o de todas juntas.
            - Asigna a cada persona de tu equipo la sede donde trabaja.

            ### Planes más claros (0.17.1)
            - La pantalla de Stockealo Pro compara Gratis, Pro y Pro Servicios lado a lado.
            - Puedes armar tus precios por cantidad aunque no tengas Pro; se activan con Pro.
            - Prueba los diseños de catálogo de Pro y mira cómo quedan antes de tenerlo.

            ### Precios por mayor, conteo de inventario y pedido sugerido (0.17.0)
            - Precio por cantidad (Pro): Vender lo aplica solo y tu tienda lo muestra.
            - Contar inventario en Stock: guarda a medias y al terminar ve lo que sobró y faltó.
            - El pedido al proveedor sugiere según lo que vendes y cuándo vuelve el proveedor.
            - Haz tu primera venta desde Inicio, o una venta de práctica que no guarda nada.

            ### Tu dirección y las citas a la hora correcta (0.16.9)
            - Tu tienda y las reservas muestran la dirección de tu local con «Cómo llegar».
            - El recordatorio de la cita por WhatsApp lleva la dirección.
            - Las citas se ven con la hora de tu negocio, aunque te reserven desde otro país.
            - Los precios en Editar producto se ven con puntos de mil mientras escribes.
            - Si cierras Google sin entrar, el botón se libera solo.

            ### Íconos, fiado en el pago mixto y más (0.16.8)
            - Cada categoría tiene su ícono en la tienda, Vender y Productos; se cambia en Categorías.
            - En el pago mixto puedes dejar una parte fiada: se suma a lo que debe el cliente.
            - Reportes resta los gastos que registras en Caja de la ganancia neta.
            - Los valores se ven con puntos de mil mientras escribes.
            - Las fechas de Promociones y Ventas se eligen con atajos.

            ### Todo más ordenado (0.16.7)
            - Stock es una lista con lo agotado y lo bajo arriba, y «Ajustar» en cada producto.
            - El stock ya no se cambia en Editar producto: se ajusta y queda en el historial.
            - Registrar un abono usa los mismos medios de pago que Vender, con atajos de valor.
            - El detalle del producto, «Tu negocio» y Gestionar categorías tienen el diseño nuevo.
            - Equipo tiene un solo botón «Invitar» y Stocky no muestra consejos en Caja.

            ### Vender más fácil y la hora de tu negocio (0.16.6)
            - En Vender tienes a mano las ventas en espera y las cotizaciones, también en el celular.
            - «Cobrar» queda siempre a la vista y los descuentos avisan si pasan el valor o dejan pérdida.
            - «Nueva venta» guarda la cuenta que tenías en espera y abre una vacía.
            - El recibo muestra la hora en 12 horas y Ventas cuenta «4 ventas · 1 devolución».
            - El buscador encuentra clientes y más funciones, y Ctrl K funciona en toda la app.
            - La hora de recibos, caja y reportes es la del país de tu negocio; en EE. UU. y México eliges la zona.
            - El comprobante, el vendedor y el descuento de cada venta se ven en todos tus equipos.
            - Anular una venta con devoluciones deja bien el stock y lo que debe el cliente.

            ### Devoluciones en orden (0.16.5)
            - Las devoluciones siguen en su propia tarjeta en Ventas después de recargar la app, y no se puede devolver más de lo vendido.

            ### La caja y las cuentas, al día (0.16.4)
            - La caja muestra bien la hora en que se abrió y no deja sacar más plata de la que hay.
            - Si te equivocas en una entrada o salida de caja, tócala para anularla.
            - Al devolver algo de un pago mixto, eliges si devuelves en efectivo o por otro medio.
            - Ventas muestra una tarjeta por venta, y Reportes, Caja y Stocky dan las mismas cifras.
            - Lo que cambias en una pantalla (productos, abonos, mercancía) se ve al instante en las demás.
          draft: false
          prerelease: false
