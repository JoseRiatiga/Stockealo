name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Todo en su lugar
            - Cada cosa tiene un solo lugar y los accesos se ven sin deslizar. La primera vez te mostramos «Dónde quedó cada cosa».
            - Inicio es el resumen del día: toca cada cifra para ir a su lugar.
            - Ventas: Clientes y fiados, Cotizaciones y Caja. Inventario: Catálogo, Tienda, Proveedores y entradas e Importar desde Excel.
            - Reportes reúne Ganancias y Descargar Excel.
            - Ajustes › Tu negocio: datos, equipo, actividad, Módulos y Stockealo Pro, a un toque.
            - El buscador también encuentra funciones: escribe «caja» o «proveedores».

            ### Importar desde Excel, paso a paso
            - Trae tus productos aunque tu Excel tenga títulos más abajo, varias hojas o precios como «$12.500».
            - Confirmas qué es cada columna, ves cómo quedan y eliges si actualizar o sumar el stock. También .csv y una plantilla.

            ### Caja mejorada
            - Entradas y salidas con motivo, propinas por entregar y mercancía de contado.
            - Cierre por forma de pago, conteo por billetes y monedas, nota si no cuadra y comprobante por WhatsApp.
            - El estado de la caja se ve en Inicio y te avisa si cobras en efectivo con la caja cerrada. Se enciende en Ajustes › Módulos.

            ### Pro Servicios: lavaderos, barberías, talleres y más
            - Pestaña Servicios con tablero, asistencia, historial, comisiones, catálogo y mensajes.
            - Plantillas por tipo de negocio y precio según el vehículo (moto, carro, camioneta).
            - Nadie empieza un servicio sin haber llegado y estar libre; cola por orden de llegada con turno y espera estimada.
            - Comisiones por servicio y liquidaciones con detalle por WhatsApp. Mensajes por fase para avisar al cliente.

            ### Ayuda
            - Ajustes › Ayuda › Sugerencias y fallos: cuéntanos qué no funciona o qué te gustaría, y mira nuestra respuesta.

            ### Correcciones
            - En la web te avisamos cuando hay una versión nueva.
            - La ventana Equipo tiene el diseño nuevo.
          draft: false
          prerelease: false
