name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Servicios para tu tipo de negocio
            - Al crear un negocio te preguntamos «¿Para qué usarás Stockealo?» y te sugerimos la plantilla: lavadero, barbería, spa, taller, servicio técnico o lavandería.
            - Servicios ahora es gratis hasta 3 empleados: catálogo, tablero, agenda y cobro.
            - En el tablero cada servicio tiene su propia tarjeta y se mueve por separado.

            ### Agenda y reservas
            - Agenda de citas por día, con aviso si dos citas chocan. Al llegar el cliente, la cita se vuelve una orden.
            - Con Pro Servicios, tus clientes reservan desde tu tienda en línea y te llega el aviso al instante.
            - Historial de cada cliente: cuántas veces viene, cuánto ha gastado y qué pide.

            ### Taller, servicio técnico y lavandería
            - Estados como «Esperando aprobación» o «Esperando repuesto», y fecha de entrega.
            - Presupuesto por WhatsApp o aprobado en el local.
            - Recepción con fotos, accesorios recibidos y garantía. En la lavandería se cobra por kilo o por prenda.

            ### Cobro y empleados
            - Pago mixto (efectivo + Nequi) y fiado con abono.
            - Vende productos o repuestos dentro del mismo cobro; salen del inventario.
            - Alquiler de silla: el empleado paga un fijo por día, semana o mes y se queda con sus servicios.
            - La liquidación de comisiones y la orden de servicio salen como tiquete.
            - Anula solo un servicio o todo el cobro; la venta queda como «Anulada», no se borra.

            ### Panel de administración renovado
            - Menú por grupos, búsqueda con Ctrl K y el mismo diseño del resto de la app.
          draft: false
          prerelease: false
