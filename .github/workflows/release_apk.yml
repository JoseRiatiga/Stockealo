name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Stockealo con diseño nuevo
            - Más claro y ordenado, con el color de tu negocio en lo importante. El modo oscuro sigue a un toque.
            - Un solo menú que sigue el día: Inicio, Vender, Ventas, Caja, Productos, Stock, Clientes y proveedores, Reportes y Ajustes. En el celular se abre con ☰.
            - «Nueva venta», el buscador (Ctrl K) y el estado de la caja siempre arriba.

            ### Inicio
            - Las cifras del día: ventas de hoy frente a la semana pasada, ganancia del mes, fiados y efectivo en caja.
            - «Necesita atención»: lo agotado, los fiados vencidos y la caja sin cerrar, con la solución a un toque (pedir al proveedor, cobrar por WhatsApp).

            ### Vender, como un punto de venta
            - Busca, escanea (también con lector USB) y toca: la cuenta queda a la vista.
            - Efectivo con el vuelto, Nequi, transferencia, tarjeta, fiado y pago mixto. F9 cobra.
            - Ventas en espera y cotizar desde ahí mismo.
            - Si tu negocio usa caja, primero se abre la caja.

            ### Caja y ventas
            - El cierre muestra el resultado en grande: «La caja está justa», «Faltan» o «Sobran».
            - Anular una venta ya no la borra: queda en Ventas como «Anulada», con el motivo.

            ### Comprobantes y códigos
            - Un tiquete nuevo que «sale de la impresora», con sello (Pagado, Fiado, Anulada, Cotización, Abono, Caja justa) y se envía como imagen.
            - Nuevo lector de códigos: cámara, foto o a mano, y avisa si el código está mal escrito o repetido.

            ### Tienda en línea
            - Dos plantillas: Clásica y Moda (con filtros por talla, color y precio, y ofertas).
            - Al pedir, el cliente recibe su tiquete «Por confirmar».
          draft: false
          prerelease: false
