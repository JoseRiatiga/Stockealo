name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Paga Stockealo Pro en línea
            - **Pago seguro con Wompi** dentro de la app: Nequi, PSE, tarjeta o Bancolombia. Pro se activa solo en cuanto se aprueba el pago.
            - **Planes nuevos:** semanal, mensual y **anual con 2 meses gratis**.

            ### Tienda en línea (Stockealo Pro)
            - **Tu catálogo con carrito** en stockealo.online/tienda/tu-negocio: tus clientes eligen los productos y te mandan el pedido por WhatsApp.
            - Solo muestra productos con stock, con foto y precio. Nunca tus costos ni tus clientes.
            - Actívala en Inventario › Tienda y comparte el enlace.

            ### Mejoras
            - Banderas a color en el número de celular y al elegir el país.
            - El celular ahora es obligatorio al crear la cuenta.
            - Gráficas del inicio, menús y pantallas de Ajustes con el diseño de la app, también en el computador.
            - Stocky ahora está abajo a la derecha también en la versión web.
            - Términos y política de privacidad actualizados, también en stockealo.online.
          draft: false
          prerelease: false
