name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Más rápido y estable
            - Actualizamos el motor de la app. La versión web ya no llena la consola de avisos al mostrar fotos y aprovecha mejor la memoria.
            - Desde esta versión, la app necesita Android 6.0 o más nuevo.

            ### Modo claro u oscuro, a un toque
            - En Ajustes › Apariencia hay un solo interruptor, «Modo oscuro», que se guarda al instante.
            - Botón de sol o luna junto a la campana para cambiarlo rápido.

            ### Accesos rápidos en Inicio
            - Vuelven los accesos rápidos: toca «Personalizar» y elige hasta 8 funciones, en el orden que quieras.
            - Cada acceso abre la función directamente: nueva venta, caja, nuevo producto, proveedores, ganancias…

            ### Correcciones
            - Inventario: «Ver cuáles» de los productos por reponer ahora baja a la lista ya filtrada y muestra el filtro con su ✕.
            - El buscador tiene el diseño de la app, en claro y en oscuro, y separa funciones y productos.
            - Ver o vender un producto desde el buscador ya no puede fallar.
          draft: false
          prerelease: false
