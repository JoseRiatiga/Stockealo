name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Metas de ventas
            - Pon una meta semanal o mensual y mira el avance con su gráfica en Inicio y en Reportes › Metas.
            - Con Pro: meta para cada empleado e historial.

            ### Tienda en línea a tu estilo
            - Cinco estilos (Clásica, Moda, Mercado, Menú y Boutique), tu color, modo oscuro, hasta 6 destacados y horario con «Abierto» o «Cerrado».
            - Cupones: crea «BIENVENIDA10» y compártelo. Cada cliente lo usa una vez. Gratis 1 cupón activo; con Pro, varios.
            - Estadísticas: visitas, pedidos, lo más pedido y de dónde llegan tus clientes.
            - Comparte en Instagram (historia, cuadrado, vertical o carrusel), el QR de tu tienda y el catálogo con cinta de oferta.

            ### Productos
            - Plantillas por tipo de negocio (licorera, vapers, droguería, ropa, comidas y tienda de barrio) y marca del producto.
            - Lotes con fecha de vencimiento: aviso antes de que venzan y cambio al distribuidor.
            - En un agotado: «Recordarme si no llega» y «Ocultarlo en Vender».
            - En el computador, arrastra o pega la foto del código en el lector.

            ### Seguridad y cuenta
            - Bloquea la app con PIN o huella.
            - Entra con Google.
            - Descarga todos tus datos en Excel (Perfil › Privacidad).

            ### Y además
            - La app habla el español de tu celular (fechas y calendario).
            - Ves si tus datos están al día en la nube.
            - Primeros pasos para negocios nuevos y aviso de productos quietos.
            - Novedades en Ajustes › Acerca de, y «Lo nuevo» al actualizar.
            - Cupones de descuento al pagar Pro.
          draft: false
          prerelease: false
