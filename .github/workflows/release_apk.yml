name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            **Importante:** las versiones anteriores ya no sincronizan con la nube. Actualiza para que tus datos se suban de nuevo; lo que tengas guardado en el teléfono no se pierde.

            ### Seguridad
            - **Inicio de sesión más seguro.** La primera vez entra con tu correo y tu contraseña de siempre; la app actualiza tu cuenta sola.
            - **Cada negocio solo lo ven sus miembros**, y cada rol (dueño, administrador, cajero) solo puede hacer lo que le corresponde, también en la nube.
            - **Cada cuenta tiene sus propios datos** en el teléfono: si otra persona inicia sesión en el mismo celular, no ve tu inventario.
            - **Recuperar la contraseña es más fácil:** el código se verifica una vez y puedes intentar la contraseña nueva las veces que necesites.

            ### Sincronización
            - **Funciona sin internet:** los cambios se guardan y se suben solos cuando vuelve la conexión.
            - **El stock y los fiados ya no se pisan** cuando se usa la app en varios teléfonos a la vez.
            - **Ventas en tiempo real** entre los teléfonos del mismo negocio.
            - Los negocios nuevos y la papelera de negocios se sincronizan correctamente.

            ### Funciones nuevas
            - **Arqueo de caja:** abre la caja con una base, registra el día y al cerrar ves si sobra o falta dinero.
            - **Recordatorio de fiados por WhatsApp** con el saldo del cliente.
            - **Respaldo:** guarda una copia de tus datos en un archivo y restáurala cuando la necesites.
          draft: false
          prerelease: false
