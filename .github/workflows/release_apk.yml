name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Tallas y colores
            - **Variantes con talla y color:** escribe las tallas y los colores y la app arma la tabla para poner cuántas hay de cada combinación (M Rojo, M Verde…).
            - **Muestra de color** de una paleta o con su código, de **dos tonos** (blanca con roja) o **multicolor**.
            - Si ya tenías tallas escritas como "M (ROJO)", la app te ofrece separarlas en talla y color sin perder tus existencias.
            - Al vender eliges la talla y luego el color, con su muestra y las unidades disponibles.
            - Tus tallas y colores ahora se guardan en la nube y se ven en todos tus equipos.

            ### Fotos de productos
            - **Trae la foto desde un enlace:** pega el enlace del producto de Shein, Temu, Mercado Libre, Amazon u otra tienda.
            - En el computador puedes **pegar una imagen con Ctrl+V** mientras editas el producto.

            ### La versión web, siempre en la nube
            - En el navegador tus datos se guardan siempre en tu cuenta: no se pierden al borrar el historial ni al cambiar de computador.
            - Si usas Stockealo en el celular sin la nube, la web te explica cómo activarla para ver tu negocio.
            - En el celular, un recordatorio de vez en cuando para activar la copia en la nube.

            ### Correcciones
            - Canjear un código Pro o pagar ya no falla cuando el negocio aún no estaba en la nube; el código se acepta aunque lo escribas sin guiones.
            - Al anular una venta, la unidad vuelve también a su talla o color.
            - La sesión se renueva sola al volver a la pestaña después de un rato.
          draft: false
          prerelease: false
