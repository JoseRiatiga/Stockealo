name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## 🚀 Novedades de la versión ${{ github.ref_name }}
            - 🔑 **Recuperación de Contraseña por Correo (OTP 6 Dígitos)**: Autoservicio para usuarios con código de verificación enviado directamente desde la cuenta oficial de soporte (`soporte.stockealo@gmail.com`) y cifrado seguro SHA-256 + Pepper.
            - 🔐 **Firma Oficial Permanente (Keystore Unificada)**: Todas las versiones ahora comparten la misma firma criptográfica oficial para permitir actualizaciones fluidas con 1 solo toque sin conflicto de paquetes.
            - 👗 **Variantes de Producto (Tallas, Colores y Modelos)**: Creación opcional de variantes con stock independiente por talla/color (presets rápidos de ropa y calzado, códigos de barras por talla y selector visual en el punto de venta).
            - 🛒 **Terminal POS & Carrito Multi-Producto**: Facturación unificada para múltiples productos en una sola compra, buscador integrado, lector de código de barras y preservación de la venta rápida de 1 producto en 3 segundos.
            - 🏷️ **Motor de Descuentos por Mayor & Blindaje Anti-Pérdidas**: Descuentos en porcentaje (%) o monto fijo ($) con validación matemática en vivo para proteger la rentabilidad y bloquear ventas a pérdida en cajeros.
            - 📄 **Gestor de Cotizaciones / Proformas**: Creación de presupuestos con validez de 15 días, compartibles por WhatsApp y convertibles a venta final en 1 solo clic con validación automática de inventario.
            - 🤖 **Stocky Cyber-Bot & Copiloto Comercial**: Nueva anatomía con propulsores de levitación iónica, LED reactivo y asistente inteligente en el Dashboard con diagnósticos proactivos de inventario y fiados.
            - 📱 **Catálogo para Redes Sociales & Historias**: Exportación dual en PDF y tarjetas PNG 9:16 en Ultra-HD para WhatsApp e Instagram Stories, con selector de densidad (1, 2, 4 o 6 productos) y pedidos directos a WhatsApp.
            - 🔔 **Notificaciones Push / Realtime en Vivo**: Alertas instantáneas y campanita con badge cuando cajeros registran ventas en tiempo real, sin requerir configuración manual.
            - 🛡️ **Seguridad y Blindaje de Roles**: Protección total para cajeros (costos de compra y márgenes ocultos; acceso restringido para crear o modificar catálogo).
          draft: false
          prerelease: false
