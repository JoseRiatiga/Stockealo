name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Arreglo de la 0.15.1
            - Los roles propios que crea el dueño ahora sí se guardan en la nube y llegan a los celulares de todo el equipo.

            ### Tu equipo, con sus propios permisos
            - Crea roles a tu medida (por ejemplo «Cajero de la tarde») y elige qué puede hacer cada uno. Con «Ver como» ves la app igual que tu empleado.
            - Con Pro: límites por rol (descuento, fiado, horas para anular y salidas de caja). Si alguien los pasa, te llega la solicitud al celular para aprobarla.
            - Horario de acceso por empleado, con aviso 10 minutos antes de cerrarle.
            - Arqueo ciego: el cajero cuenta la caja sin ver cuánto debería haber.

            ### Ventas
            - Devolución parcial: elige cuántas unidades y si vuelven al inventario o llegaron dañadas. El dinero vuelve según cómo pagó (efectivo sale de la caja, fiado baja la deuda).
            - Descuento por producto, además del descuento a toda la venta.
            - Las ventas en espera ya no se pierden al cerrar la app.
            - Precio sugerido según el margen que quieras ganar.
            - Tiquete con tu NIT, dirección, teléfono y tu propia despedida.
            - Cierre del día por WhatsApp y recordatorio para cerrar la caja.

            ### Tienda en línea
            - Foto de portada o tu logo.
            - Tallas y colores se eligen en la tarjeta del producto; lo agotado sale tachado.
            - Una foto por color y un carrito más claro, en dos pasos.

            ### Planes
            - Un solo plan Pro, un buscador que te dice qué plan te sirve y aviso antes de que venza.
          draft: false
          prerelease: false
