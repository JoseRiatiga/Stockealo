name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Proveedores y entrada de mercancía
            - Nueva sección Inventario › Proveedores: ficha de cada proveedor con WhatsApp, día en que pasa, forma de pago y notas.
            - En cada producto puedes indicar su proveedor (es opcional).
            - Entrada de mercancía: lo que llega suma al inventario, también por talla y color, con factura, foto de la factura y borrador.
            - Si el costo cambió, la app te avisa y te deja actualizarlo.

            ### Pedidos al proveedor
            - El pedido sale por talla y color y se envía directo al WhatsApp del proveedor.
            - Al recibir la mercancía ves qué faltó y puedes pedirlo de nuevo.
            - El día que pasa tu proveedor la app te lo recuerda.

            ### Cuentas por pagar y costos
            - Compras a crédito con abonos y aviso de las vencidas.
            - En cada producto ves cuánto te cobra cada proveedor y cuál es el más barato.
            - Reportes en Excel de compras y de costos por proveedor.

            ### Correcciones
            - Al pegar la foto de un producto ahora ves que quedó lista.
          draft: false
          prerelease: false
