name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/stockealo-release.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=stockealo-release.jks" >> android/key.properties

      - name: Build APK Release
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Stockealo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stockealo.apk
          tag_name: ${{ github.ref_name }}
          name: Stockealo ${{ github.ref_name }}
          body: |
            ## Novedades de la versión ${{ github.ref_name }}

            ### Negocios de servicios: lavaderos, barberías y talleres
            - Activa "Mi negocio ofrece servicios" al editar tu negocio y elige el tipo; te dejamos servicios de ejemplo para empezar.
            - Tablero de trabajos: cada moto pasa por En espera, Lavando, Lista y Entregada, con placa y quién la atiende.
            - Avisa al cliente por WhatsApp cuando su moto está lista.
            - Cobra con descuento, propina para el empleado y fiado; cada servicio queda en tus ventas.
            - Historial por placa: cuántas veces vino, qué se le hizo y cuánto ha gastado.
            - Empleados sin cuenta en la app (2 gratis; sin límite con Pro).

            ### Reportes en su propia pestaña
            - Reportes ahora está en el menú principal, junto a Inicio, Inventario, Ventas y Ajustes.

            ### Correcciones
            - El logo del negocio ya se sube desde la web.
            - La ventana para elegir una foto tiene el diseño nuevo.
            - Al anular la venta de una talla o color, esa variante recupera su unidad.
          draft: false
          prerelease: false
