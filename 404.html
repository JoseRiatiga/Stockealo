<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/Stockealo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="Stockealo: Tu negocio bajo control. Gestión de inventario, ventas, clientes y catálogo comercial.">

  <!-- Web & Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stockealo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stockealo - Control de Inventario</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#0F172A;">
  <div id="flutter-splash" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;z-index:999999;font-family:system-ui,-apple-system,sans-serif;color:#F8FAFC;transition:opacity 0.4s ease;">
    <div style="width:72px;height:72px;background:#064E3B;border:2px solid #059669;border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 0 25px rgba(5,150,105,0.35);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7.5 4.27 9 5.15"/>
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </svg>
    </div>
    <h1 style="font-size:24px;font-weight:700;margin:0 0 8px;letter-spacing:-0.5px;">Stockealo</h1>
    <p style="font-size:13px;color:#94A3B8;margin:0 0 24px;">Cargando tu negocio...</p>
    <div style="width:160px;height:4px;background:#1E293B;border-radius:99px;overflow:hidden;position:relative;">
      <div style="width:50%;height:100%;background:#10B981;border-radius:99px;animation:stockealo-load 1.2s infinite ease-in-out;"></div>
    </div>
  </div>
  <style>
    @keyframes stockealo-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('flutter-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
