<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Stockealo: Tu negocio bajo control. Gestión inteligente de inventario, ventas, clientes y catálogo comercial.">
  <meta name="application-name" content="Stockealo">
  <meta name="keywords" content="inventario, punto de venta, pos, colombia, ventas, stock, productos, pwa">

  <!-- OpenGraph & Social Sharing -->
  <meta property="og:title" content="Stockealo - Control de Inventario y Ventas">
  <meta property="og:description" content="Gestión inteligente de inventario, ventas, clientes y catálogo comercial para tu negocio.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Web & Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stockealo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stockealo - Control de Inventario y Ventas</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Pantalla mientras baja la app (re-diseño 0.13.0): claro y limpio, oscuro si el equipo está en oscuro -->
  <style>
    :root { --paper:#F6F7F9; --ink:#14161A; --muted:#5B6170; --track:#E6E8EC; --brand:#1E6B4E; }
    @media (prefers-color-scheme: dark) { :root { --paper:#0E1013; --ink:#F2F4F7; --muted:#A3AAB8; --track:#262A31; } }
    body { margin:0; background:var(--paper); overflow:hidden; -webkit-tap-highlight-color:transparent; }
    #flutter-splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--paper); z-index:999999; pointer-events:none; transition:opacity .3s ease;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    #flutter-splash .logo { width:64px; height:64px; border-radius:16px; background:var(--brand); display:flex;
      align-items:center; justify-content:center; margin-bottom:16px; }
    #flutter-splash h1 { font-size:26px; font-weight:700; letter-spacing:-.5px; color:var(--ink); margin:0 0 4px; }
    #flutter-splash p { font-size:14px; color:var(--muted); margin:0 0 24px; }
    #flutter-splash .bar { width:160px; height:4px; border-radius:99px; background:var(--track); overflow:hidden; }
    #flutter-splash .bar span { display:block; width:40%; height:100%; border-radius:99px; background:var(--brand);
      animation:stockealo-load 1.2s infinite ease-in-out; }
    @keyframes stockealo-load { 0% { transform:translateX(-100%); } 100% { transform:translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #flutter-splash .bar span { animation:none; width:100%; opacity:.5; } }
  </style>
  <div id="flutter-splash" role="status" aria-label="Cargando Stockealo">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m7.5 4.27 9 5.15"/>
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </svg>
    </div>
    <h1>Stockealo</h1>
    <p>Cargando tu negocio…</p>
    <div class="bar"><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('flutter-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
