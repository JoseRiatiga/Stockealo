<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Stockealo</title>
  <script>
    // GitHub Pages solo tiene un 404 para todo el sitio: cada ruta vuelve a su app
    var p = location.pathname;
    var tienda = p.match(/^\/tienda\/([a-z0-9-]+)\/?$/i);
    // 0.16.0: el producto compartido (?p=…) también llega
    var prod = location.search.match(/[?&]p=([A-Za-z0-9-]+)/);
    var src = location.search.match(/[?&]src=([a-z]+)/);
    if (tienda) location.replace('/tienda/?t=' + tienda[1].toLowerCase() + (prod ? '&p=' + prod[1] : '') + (src ? '&src=' + src[1] : ''));
    else if (p.indexOf('/tienda') === 0) location.replace('/tienda/');
    else location.replace(p.indexOf('/admin') === 0 ? '/admin/' : '/app/');
  </script>
</head>
<body></body>
</html>
