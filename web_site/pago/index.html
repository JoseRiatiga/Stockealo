<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago recibido · Stockealo</title>
  <style>
    :root { --paper: #F6F7F9; --surface: #FFFFFF; --ink: #14161A; --muted: #5B6170; --line: #E6E8EC; --accent: #1E6B4E; --on-accent: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0E1013; --surface: #16191E; --ink: #F2F4F7; --muted: #A3AAB8; --line: #262A31; --accent: #5CC497; --on-accent: #10261C; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
            padding: 28px 24px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 8px; }
    .ok { font-size: 40px; color: var(--accent); }
    .btn { display: block; margin: 20px 0 8px; padding: 14px 16px; border-radius: 12px; background: var(--accent);
           color: var(--on-accent); font-weight: 700; text-decoration: none; }
    .link { color: var(--accent); font-size: 14px; }
    small { color: var(--muted); display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok" aria-hidden="true">✓</div>
    <h1>Gracias por tu pago</h1>
    <p>En cuanto Wompi lo apruebe, Stockealo Pro se activa solo en tu negocio.</p>
    <a class="btn" id="open-app" href="stockealo://pago">Volver a la app de Stockealo</a>
    <a class="link" href="/app/">Estoy usando Stockealo en el navegador</a>
    <small id="ref"></small>
  </main>
  <script>
    // Wompi agrega ?id=<transacción>; se muestra para soporte
    var id = new URLSearchParams(location.search).get('id');
    if (id) document.getElementById('ref').textContent = 'Transacción ' + id;
    // En el celular se intenta volver solo a la app (si el navegador lo permite)
    if (/Android/i.test(navigator.userAgent)) {
      setTimeout(function () { location.href = 'stockealo://pago' + (id ? '?id=' + encodeURIComponent(id) : ''); }, 600);
    }
  </script>
</body>
</html>
